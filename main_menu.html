<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC Store - Catálogo</title>
    <link rel="stylesheet" href="main_menu.css">
</head>

<body>

    <!-- Encabezado con Logo y Buscador -->
    <header class="main-header">
        <h1 class="logo"><a href="main_menu.html">My PC Store</a></h1>
        <div class="search-container">
            <input type="text" placeholder="Buscar productos...">
        </div>
        <div class="user-links">
            <a href="login.html" class="btn-account">Mi Cuenta</a>
            <a href="cart.html" class="btn-account">
                Carrito <span id="header-cart-badge" class="badge">0</span>
            </a>
        </div>
    </header>

    <!-- Barra de navegación por categorías -->
    <nav class="nav-bar">
        <a href="#">PC gamer</a>
        <a href="#">Laptops</a>
        <a href="#">Monitores</a>
        <a href="#">Mantenimiento</a>
        <a href="pago.html">Metodos de pago</a>
        <a href="login.html">Sobre nosotros</a>
    </nav>

    <!-- Banner promocional -->
    <section class="hero-banner">
        <div class="banner-text">
            Precios<br>increibles
        </div>
    </section>

    <!-- Cuadrícula de productos -->
    <main class="products-container">



    </main>

    <!-- Botón flotante para el carrito con contador -->
    <a href="cart.html" class="floating-cart-btn" id="floating-cart" title="Ver carrito">
        <img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" alt="Carrito">
        <span id="floating-badge" class="floating-badge">0</span>
    </a>

    <!-- Notificación Toast -->
    <div id="notification-toast" class="toast">¡Producto agregado al carrito!</div>

    <!-- Script -->
    <script>
        // Función para actualizar los contadores visuales del carrito
        function actualizarContadores() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const totalItems = carrito.reduce((suma, item) => suma + item.cantidad, 0);

            const floatingBadge = document.getElementById('floating-badge');
            floatingBadge.textContent = totalItems;
            floatingBadge.style.display = totalItems > 0 ? 'flex' : 'none';

            const headerBadge = document.getElementById('header-cart-badge');
            headerBadge.textContent = totalItems;
            headerBadge.style.display = totalItems > 0 ? 'inline-block' : 'none';
        }

        // Cargar productos desde la API de Node.js
        function cargarProductos() {
            fetch('http://localhost:3000/productos')
                .then(res => res.json())
                .then(productos => {
                    const contenedor = document.querySelector('.products-container');
                    contenedor.innerHTML = ''; // Limpiamos contenedor

                    productos.forEach(prod => {
                        // Imagen por defecto o personalizada según el ID
                        let imagenUrl = "https://http2.mlstatic.com/D_NQ_NP_2X_912925-MLU74599694729_022024-F.webp";
                        if (prod.id === 2) imagenUrl = "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=500"; // Ejemplo para PC
                        if (prod.id === 3) imagenUrl = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=500"; // Ejemplo para Monitor

                        contenedor.innerHTML += `
                            <article class="product-card" data-id="${prod.id}">
                                <div class="product-image-box">
                                    <img src="${imagenUrl}" alt="${prod.nombre}">
                                </div>
                                <h2 class="product-title">${prod.nombre}</h2>
                                <div class="product-price">$ ${Number(prod.precio).toLocaleString()}</div>
                                <button type="button" class="btn-add-cart">Agregar al carrito</button>
                            </article>
                        `;
                    });
                })
                .catch(err => console.error("Error al conectar con la API:", err));
        }

        // Delegación de eventos para agregar al carrito los elementos dinámicos
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-add-cart')) {
                const card = e.target.closest('.product-card');
                const id = parseInt(card.getAttribute('data-id'));
                const nombre = card.querySelector('.product-title').textContent.trim();
                const precioTexto = card.querySelector('.product-price').textContent.replace('$', '').replace(/\./g, '').trim();
                const precio = parseFloat(precioTexto);
                const img = card.querySelector('img').src;

                let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
                const existente = carrito.find(item => item.id === id);

                if (existente) {
                    existente.cantidad += 1;
                } else {
                    carrito.push({ id, nombre, precio, img, cantidad: 1 });
                }

                localStorage.setItem('carrito', JSON.stringify(carrito));

                const cartBtn = document.getElementById('floating-cart');
                cartBtn.classList.add('bounce');
                setTimeout(() => cartBtn.classList.remove('bounce'), 500);

                actualizarContadores();

                const toast = document.getElementById('notification-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }
        });

        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            cargarProductos();
            actualizarContadores();
        });
    </script>

</body>

</html>
