<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC - Crear Cuenta</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Enlace superior a inicio -->
    <div class="brand-watermark">
        <a href="main_menu.html">MY PC</a>
    </div>

    <!-- Tarjeta de registro centrada -->
    <main class="login-card">
        <h2>Crear Cuenta</h2>

        <form id="register-form">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" minlength="4" required>
            </div>

            <div class="footer-container">
                <div class="register-text">
                    ¿Ya tienes cuenta?<br>
                    <a href="login.html">inicia sesión</a>
                </div>
                <button type="submit" class="btn-submit" id="btn-submit">Registrarme</button>
            </div>
        </form>
    </main>

    <!-- Notificación Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const form = document.getElementById('register-form');
        const toast = document.getElementById('toast');
        const btnSubmit = document.getElementById('btn-submit');

        function mostrarMensaje(mensaje, esError = false) {
            toast.textContent = mensaje;
            if (esError) {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value.trim();

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Enviando...';

            try {
                const response = await fetch('http://localhost:3000/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo, password })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarMensaje('¡Cuenta creada con éxito! Redirigiendo...', false);
                    form.reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1800);
                } else {
                    mostrarMensaje(data.error || 'No se pudo crear la cuenta', true);
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Registrarme';
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                mostrarMensaje('Error de conexión con el servidor (Node.js)', true);
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Registrarme';
            }
        });
    </script>

</body>

</html>
